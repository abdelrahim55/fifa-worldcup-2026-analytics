name: Project quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python modules
        run: python -m compileall -q app.py src pages scripts

      - name: Run tests
        run: python -m pytest -q

      - name: Lint
        run: ruff check app.py src pages scripts tests
